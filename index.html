<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StyleShift — Design Style Converter</title>
<style>
:root{--bg:#f4f5f9;--pn:#fff;--tx:#161a2b;--mu:#6b7186;--bd:#e0e3ee;--ac:#6366f1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c0e18;--pn:#161a2b;--tx:#eceefa;--mu:#9097b3;--bd:#262b45}}
:root[data-theme=dark]{--bg:#0c0e18;--pn:#161a2b;--tx:#eceefa;--mu:#9097b3;--bd:#262b45}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:20px 24px 8px}h1{margin:0;font-size:26px;letter-spacing:-.02em;background:linear-gradient(90deg,#6366f1,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:2px 0 0;color:var(--mu)}
.app{display:grid;grid-template-columns:390px 1fr;gap:16px;padding:12px 24px 28px;align-items:start}
@media(max-width:900px){.app{grid-template-columns:1fr;padding:12px 14px}}
.p{background:var(--pn);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:14px}
.p h2{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
textarea{width:100%;height:190px;resize:vertical;background:var(--bg);color:var(--tx);border:1px dashed var(--bd);border-radius:10px;padding:10px;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace}
textarea.drag{border-color:var(--ac);background:rgba(99,102,241,.08)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
button,.btn{font:inherit;cursor:pointer;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:7px 12px;transition:transform .15s,border-color .15s}
button:hover,.btn:hover{border-color:var(--ac);transform:translateY(-1px)}
.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
#gal{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:360px;overflow:auto;padding:2px}#q{width:100%;padding:8px 10px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;font:inherit}select{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:4px}#xcss{height:70px}
#gal button{display:flex;gap:9px;align-items:center;text-align:left;padding:8px}
#gal button.on{border-color:var(--ac);box-shadow:0 0 0 2px rgba(99,102,241,.35)}
#gal i{flex:none;width:30px;height:30px;border-radius:8px;border:1px solid var(--bd)}
#gal b{display:block;font-size:13px}#gal small{display:block;color:var(--mu);font-size:11px;line-height:1.2}
label{display:flex;align-items:center;gap:8px;margin:8px 0;color:var(--mu)}label input[type=range]{flex:1}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--pn)}.seg button.on{background:var(--ac);color:#fff}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:12px}
#stage{display:flex;gap:12px;justify-content:center}
.fr{flex:1;min-width:0;max-width:var(--w,100%)}.fr span{display:block;font-size:11px;color:var(--mu);margin:0 0 4px 4px;text-transform:uppercase;letter-spacing:.08em}
iframe{width:100%;height:68vh;min-height:460px;border:1px solid var(--bd);border-radius:14px;background:#fff}
#out{height:68vh;min-height:460px;display:none;border-style:solid}
#note{font-size:12px;color:var(--mu);margin-top:10px}#note b{color:#16a34a}
@media(max-width:700px){#stage.split{flex-direction:column}}
</style></head><body>
<header><h1>StyleShift</h1><p>Paste or upload your code, pick a design style, preview it live. Only a visual-override block is added — your original code stays untouched.</p></header>
<div class="app">
<div>
<div class="p"><h2>1 · Your code (HTML or CSS)</h2>
<textarea id="src" spellcheck="false" placeholder="Paste HTML / CSS here, drop a file, or press Load sample. Empty = sample page."></textarea>
<div class="row"><label class="btn" style="margin:0">Upload file<input id="file" type="file" accept=".html,.htm,.css,.txt,.svg" hidden></label><button id="sample">Load sample</button><button id="clear">Clear</button></div></div>
<div class='p'><h2>2 · Design style · <span id='cnt'></span></h2><div class='row' style='margin:0 0 8px'><input id='q' placeholder='Search styles…' style='flex:1'><button id='rnd' class='pri'>🎲 Surprise me</button></div><div id='gal'></div><div style='font-size:11px;color:var(--mu);margin-top:6px'>Tip: use the ← → arrow keys to flip through styles.</div></div>
<div class="p"><h2>3 · Tune</h2>
<label>Accent <input id="acc" type="color" value="#6366f1"></label>
<label>Intensity <input id="int" type="range" min=".5" max="1.6" step=".1" value="1"></label>
<div class="row" style="margin:0 0 6px"><span style="color:var(--mu)">Palette</span><div class="seg" data-k="dark"><button data-v="0" class="on">Light</button><button data-v="1">Dark</button></div></div>
<label><input id="lay" type="checkbox"> Allow layout tweaks (Bento tiles only)</label><label><input id='fx' type='checkbox'> Hover and motion effects</label><label><input id='snd' type='checkbox'> Click sounds</label><label>Font <select id='font'><option value=''>Style default</option><option value='system-ui,sans-serif'>System sans</option><option value='Georgia,serif'>Serif</option><option value='ui-monospace,Menlo,monospace'>Monospace</option><option value='ui-rounded,Nunito,sans-serif'>Rounded</option><option value='Impact,Arial Black,sans-serif'>Impact</option><option value='Brush Script MT,cursive'>Script</option></select></label><div class='row' style='margin:0 0 8px'><span style='color:var(--mu)'>Apply to</span><label style='margin:0'><input type='checkbox' data-sc='bg'> Page</label><label style='margin:0'><input type='checkbox' data-sc='txt'> Text</label><label style='margin:0'><input type='checkbox' data-sc='card'> Cards</label><label style='margin:0'><input type='checkbox' data-sc='btn'> Buttons</label><label style='margin:0'><input type='checkbox' data-sc='inp'> Inputs</label></div><textarea id='xcss' spellcheck='false' placeholder='Extra CSS tweaks (added to the design block)…'></textarea></div>
</div>
<div>
<div class="bar"><div class="seg" data-k="view"><button data-v="orig">Original</button><button data-v="styled" class="on">Styled</button><button data-v="split">Split</button><button data-v="code">Code</button></div>
<div class="seg" data-k="w"><button data-v="100%" class="on">Desktop</button><button data-v="768px">Tablet</button><button data-v="390px">Mobile</button></div></div>
<div id="stage"><div class="fr" id="f1"><span>Original</span><iframe sandbox="allow-scripts allow-forms allow-modals"></iframe></div><div class="fr" id="f2"><span>Styled</span><iframe sandbox="allow-scripts allow-forms allow-modals"></iframe></div></div>
<textarea id="out" readonly></textarea>
<div class="row"><button class="pri" id="cpFull">Copy full code</button><button id="cpCss">Copy design CSS only</button><button id="dl">Download</button></div>
<div id="note"></div>
</div></div>

const BODY=`<nav><a href="#">Home</a> · <a href="#">Pricing</a> · <a href="#">About</a></nav><h1>Launch faster</h1><p>A sample page. Paste your own code on the left.</p><button id="b">Get started</button><div class="grid"><div class="card"><h3>Fast</h3><p>Ships in minutes.</p></div><div class="card"><h3>Flexible</h3><p>Fits any stack.</p></div><div class="card"><h3>Secure</h3><p>Safe by default.</p></div></div><form class="card"><input placeholder="Email"> <button type="button">Subscribe</button></form><script>document.getElementById('b').onclick=function(){this.textContent='JS still works'}<\/script>`;

function gen(){const sx=R.sel||{},pre=l=>l.split(',').map(s=>'html:not(#ss) '+s.trim()).join(','),M=(a,b)=>[a,b].filter(Boolean).join(','),SEL=Object.fromEntries(Object.entries({...SEL0,card:M(SEL0.card,sx.card),btn:M(SEL0.btn,sx.btn)}).map(([k,v])=>[k,pre(v)])),p=ST[S.style].f(S.accent,S.k,!!S.dark),F=(S.font||p.font)?';font-family:'+(S.font||p.font):'',
